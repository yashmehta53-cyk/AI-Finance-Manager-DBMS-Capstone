{% extends "base.html" %}
{% block title %}Record Transaction — AI Finance Manager{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card-luxury card-luxury-accent">
                <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                    <div>
                        <span class="eyebrow-label">Journal Voucher Entry</span>
                        <h2 class="fs-4 mb-0 font-serif">Record Financial Transaction</h2>
                    </div>
                    <a href="{{ url_for('view_transactions') }}" class="btn-luxury btn-luxury-outline btn-luxury-sm">
                        &larr; Ledger
                    </a>
                </div>
                
                <form method="POST" action="{{ url_for('add_transaction') }}" id="transactionForm" class="form-luxury">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label>Transaction Type <span class="text-danger">*</span></label>
                            <select name="txn_type" id="txn_type" class="form-select" required>
                                <option value="Expense" selected>Expense (Outflow / Cost)</option>
                                <option value="Income">Income (Inflow / Revenue)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label>Amount (₹ INR) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0.01" name="amount" id="amount" class="form-control font-mono fs-5" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label>Corporate Account <span class="text-danger">*</span></label>
                            <select name="account_id" id="account_id" class="form-select" required>
                                {% for acc in accounts %}
                                <option value="{{ acc.account_id }}">{{ acc.name }} (Available: {{ acc.balance|inr }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label>Transaction Date <span class="text-danger">*</span></label>
                            <input type="date" name="date" id="date" class="form-control font-mono" value="{{ today_date }}" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label>Transacting Party / Merchant / Client</label>
                            <input type="text" name="party_name" class="form-control" placeholder="e.g. Gujarat Cotton Traders, Tirupur Knitwear...">
                        </div>
                        <div class="col-md-6">
                            <label>Party GSTIN (Optional)</label>
                            <input type="text" name="party_gstin" class="form-control font-mono" placeholder="e.g. 33AABCT1234L1Z1">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label>Transaction Description / Narration</label>
                        <input type="text" name="description" id="description" class="form-control" placeholder="e.g. Purchase of raw cotton Shankar-6 lot, Factory power bill, Combed yarn sales..." autocomplete="off">
                        <!-- AI NLP Categorization Suggestion Box -->
                        <div id="aiSuggestionBox" class="mt-2 d-none">
                            <div class="p-2 border d-flex align-items-center justify-content-between" style="background: var(--bg-secondary); border-color: var(--antique-brass) !important;">
                                <div class="small">
                                    <span class="badge-luxury badge-luxury-wine me-1">AI Classification</span>
                                    <span>Predicted Category: <strong id="suggestedCategoryName" class="font-mono text-wine"></strong></span>
                                    <span class="text-muted ms-1" style="font-size: 0.72rem;">(<span id="suggestedConfidence"></span>% confidence)</span>
                                </div>
                                <button type="button" id="applyAiCategoryBtn" class="btn-luxury btn-luxury-brass btn-luxury-sm py-1 px-2" style="font-size: 0.72rem;">
                                    Apply
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label>Account Category <span class="text-danger">*</span></label>
                            <select name="category_id" id="category_id" class="form-select" required>
                                {% for cat in categories %}
                                <option value="{{ cat.category_id }}" data-type="{{ cat.type }}">{{ cat.name }} ({{ cat.type }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label>Applicable GST Rate</label>
                            <select name="gst_rate" class="form-select">
                                <option value="0.00">0% (Nil / Exempted)</option>
                                <option value="5.00" selected>5% (Textile Raw Cotton / Fabrics)</option>
                                <option value="12.00">12% (Synthetic / Dyes / Chemicals)</option>
                                <option value="18.00">18% (Commercial Services / Spares)</option>
                                <option value="28.00">28% (Luxury Goods)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label>Payment Instrument</label>
                            <select name="payment_method" class="form-select">
                                <option value="Bank Transfer">NEFT / RTGS / Bank Transfer</option>
                                <option value="UPI">UPI Instant Payment</option>
                                <option value="Cheque">Cheque / Demand Draft</option>
                                <option value="Cash">Cash in Hand</option>
                                <option value="Credit Note">Credit Note</option>
                                <option value="Debit Note">Debit Note</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label>Reference / Cheque / UTR #</label>
                            <input type="text" name="reference_no" class="form-control font-mono" placeholder="e.g. UTR202611048892">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a href="{{ url_for('view_transactions') }}" class="btn-luxury btn-luxury-outline">Cancel</a>
                        <button type="submit" class="btn-luxury btn-luxury-wine">
                            <i class="bi bi-check-lg me-1"></i> Post to Ledger
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const descInput = document.getElementById('description');
    const aiBox = document.getElementById('aiSuggestionBox');
    const catNameSpan = document.getElementById('suggestedCategoryName');
    const confSpan = document.getElementById('suggestedConfidence');
    const applyBtn = document.getElementById('applyAiCategoryBtn');
    const categorySelect = document.getElementById('category_id');

    let debounceTimer;
    let pendingCategoryName = null;

    descInput.addEventListener('input', function() {
        clearTimeout(debounceTimer);
        const query = this.value.trim();
        if (query.length < 4) {
            aiBox.classList.add('d-none');
            return;
        }

        debounceTimer = setTimeout(() => {
            fetch("{{ url_for('api_predict_category') }}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ description: query })
            })
            .then(res => res.json())
            .then(data => {
                if (data.predicted_category) {
                    pendingCategoryName = data.predicted_category;
                    catNameSpan.textContent = data.predicted_category;
                    confSpan.textContent = Math.round(data.confidence * 100);
                    aiBox.classList.remove('d-none');
                } else {
                    aiBox.classList.add('d-none');
                }
            })
            .catch(() => aiBox.classList.add('d-none'));
        }, 350);
    });

    applyBtn.addEventListener('click', function() {
        if (!pendingCategoryName) return;
        for (let i = 0; i < categorySelect.options.length; i++) {
            if (categorySelect.options[i].text.toLowerCase().includes(pendingCategoryName.toLowerCase())) {
                categorySelect.selectedIndex = i;
                aiBox.classList.add('d-none');
                break;
            }
        }
    });
});
</script>
{% endblock %}
